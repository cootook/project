{% extends "layout.html" %}

{% block custom_styles %}
<link href="{{ url_for('static', filename='/css/all_appointments.css') }}" rel="stylesheet">
{% endblock %}

{% block title %}
Add new service
{% endblock %}
{% block content %}
<table class="table table-dark">
    <thead>
      <tr>
        <th scope="col">Service</th>
        <th scope="col">Description</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
        {% for service in services_list %}
        <tr>
            <td>{{ service["name"] }}</td>
            <td>{{ service["description"] }}</td>
            <td>
                <form action="/edit_service/" method="get">
                    <input hidden type="text" id="service_id_edit" name="service_id_edit" value="{{ service['id'] }}">
                    <button type="submit">edit</button>
                </form>
                <form action="/delete_service/" method="get">
                    <input hidden type="text" id="service_id_delete" name="service_id_delete" value="{{ service['id'] }}">
                    <button type="submit">delete</button>
                </form>
            </td>
        </tr>
        {% endfor%}
    </tbody>
  </table>
<div class="form-group mt-3">
    <form action="/add_service/" method="post">
        
        <label for="service">service name</label>
        <input class="form-control" type="text" id="service" name="service">
        
        <label for="description">service description</label>
        <textarea class="form-control" id="description" name="description"></textarea>
        <button class="btn btn-primary my-2" type="submit">create</button>
    
    </form>
</div>

{% endblock %}
