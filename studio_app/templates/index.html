{% extends "layout.html" %}

{% block custom_styles %} 
  <!-- Custom styles for this template -->
  <link href="{{ url_for('static', filename='/css/calendar.css') }}" rel="stylesheet">
{% endblock %}

{% block title %}
Liza Nail Studio
{% endblock %}

{% block content %}
<script> var action_path = "/book/"; var slots = {{slots}}; </script>
<script src="{{ url_for('static', filename='/js/index.js') }}"></script>

{% include 'calendar.html' %}
<div class="modal fade" id="book_confirm_modal" tabindex="-1" role="dialog" aria-labelledby="book_confirm_modal_lable" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <form id="book_form" action="/book/" method="post">
    <div class="modal-content bg-dark">
      <div class="modal-header">
        <h5 class="modal-title" id="book_confirm_modal_lable">Request appointment</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
                  
          <input type="hidden" name="datetime-iso" id="datetime-iso" value="">
          <input type="hidden" name="slot_id" id="slot_id_input" value="">
            
           <span id="date-local"> </span>

           {% for service in services %}
           {% if service.deleted == False %}
           <div class="form-check">
             <input type="checkbox" class="form-check-input service-check" id="{{service.name}}" name="{{service.name}}" value="{{service.name}}">
             <label class="form-check-label px-2" for="{{service.name}}">{{service.name}}</label>
           </div>
           {% endif %}
           {% endfor %}

          <div class="form-group">
            <label for="message-text" class="col-form-label">Message:</label>
            <textarea class="form-control" id="message-text" name="message-text"></textarea>
          </div>
      </div>
      <div class="g-recaptcha" data-sitekey="{{ SITE_KEY_RECAPTCHA }}" data-callback="enable_submit_book" data-expired-callback="disable_submit_book"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button 
          type="submit" 
          class="btn btn-primary" 
          id="submit_booking_btn"
          disabled>
          Request appointment
        </button>
      </div>
    </div>
    </form>
  </div>
</div>
{% endblock %}
